model:
  _target_: research.models.transformer.transformer.TransformerLM
  d_model: 256
  n_heads: 8
  n_layers: 6
  d_ff: 1024
  max_seq_length: 256
  dropout: 0.1
  emb_dropout: 0.1
  attn_dropout: 0.1
  ff_dropout: 0.1
  pos_encoding: learned
  pre_norm: true
  activation: gelu
  tie_weights: true
  use_residual: true
dataset:
  name: wikitext2
  dataset_dir: wikitext-2
  train_file: wiki.train.tokens
  validation_file: wiki.valid.tokens
  test_file: wiki.test.tokens
  seq_length: 128
  batch_size: 32
  num_workers: 0
  pin_memory: false
  max_vocab_size: null
  min_frequency: 1
  pad_token: <pad>
  unk_token: <unk>
  verify_checksums: true
training:
  max_epochs: 3
  max_steps: null
  learning_rate: 0.0003
  weight_decay: 0.1
  gradient_clip_val: 1.0
  warmup_steps: 200
  scheduler: cosine
  eta_min_ratio: 0.1
  accumulate_grad_batches: 1
  eval_every_n_epochs: 1
  eval_batches: null
  save_best_model: true
  save_final_model: true
  checkpoint_metric: val_perplexity
  checkpoint_mode: min
  log_every_n_steps: 50
  early_stopping: false
  early_stopping_patience: 5
  early_stopping_min_delta: 0.1
  precision: null
  deterministic: true
  benchmark: false
optimizer:
  _target_: torch.optim.AdamW
  lr: ${training.learning_rate}
  weight_decay: ${training.weight_decay}
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
logging_cfg:
  level: INFO
  log_to_file: true
  log_to_console: true
  wandb:
    enabled: false
    project: transformer-ablation-study
    entity: null
    tags: []
    notes: ''
    mode: online
  tensorboard:
    enabled: false
  json_log: true
experiment:
  name: abl_post_layernorm
  phase: phase3_screening
  description: 'Switch from Pre-LN (baseline) to Post-LN. Tests whether normalization
    position affects training stability and final quality.

    '
  hypothesis: H5
  hypothesis_statement: 'Post-LN training is less stable than Pre-LN, especially at
    longer sequences, requiring careful learning rate tuning to avoid divergence.

    '
  independent_variable: pre_norm
  independent_variable_value: false
  controlled_variables:
  - d_model
  - n_heads
  - n_layers
  - d_ff
  - activation
  - use_residual
  - pos_encoding
  - dataset
  - training
  num_seeds: 2
  seeds:
  - 42
  - 1337
  model_overrides:
    pre_norm: false
experiment_name: baseline
seed: 42
runtime:
  device: cuda
paths:
  data_dir: ${hydra:runtime.cwd}/research/data
  output_dir: ${hydra:runtime.cwd}/research/results/${experiment_name}/${now:%Y-%m-%d_%H-%M-%S}_seed${seed}
  log_dir: ${hydra:runtime.cwd}/research/logs
  checkpoint_dir: ${paths.output_dir}/checkpoints
