model:
  _target_: research.models.transformer.transformer.TransformerLM
  d_model: 256
  n_heads: 8
  n_layers: 6
  d_ff: 1024
  max_seq_length: ${dataset.seq_length}
  dropout: 0.1
  emb_dropout: 0.1
  attn_dropout: 0.1
  ff_dropout: 0.1
  pos_encoding: learned
  pre_norm: true
  activation: gelu
  tie_weights: true
  use_residual: true
dataset:
  name: wikitext2
  dataset_dir: wikitext-2
  train_file: wiki.train.tokens
  validation_file: wiki.valid.tokens
  test_file: wiki.test.tokens
  seq_length: 512
  batch_size: 8
  num_workers: 0
  pin_memory: false
  max_vocab_size: null
  min_frequency: 1
  pad_token: <pad>
  unk_token: <unk>
  verify_checksums: true
training:
  max_epochs: 20
  max_steps: null
  learning_rate: 0.0003
  weight_decay: 0.1
  gradient_clip_val: 1.0
  warmup_steps: 200
  scheduler: cosine
  eta_min_ratio: 0.1
  accumulate_grad_batches: 1
  precision: bf16
  save_best_model: true
  deterministic: false
  benchmark: false
optimizer:
  _target_: torch.optim.AdamW
  lr: ${training.learning_rate}
  weight_decay: ${training.weight_decay}
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  fused: true
experiment:
  name: abl_sinusoidal_pos
  description: 'Replace learned positional encoding with fixed sinusoidal encoding.
    Tests whether position representation type (learned vs fixed) matters.

    '
  hypothesis: H1
  hypothesis_statement: 'Sinusoidal and learned positional encodings perform comparably
    on short sequences but sinusoidal may generalize better to long sequences.

    '
  independent_variable: pos_encoding
  independent_variable_value: sinusoidal
  controlled_variables:
  - d_model
  - n_heads
  - n_layers
  - d_ff
  - pre_norm
  - activation
  - use_residual
  - dataset
  - training
  model_overrides:
    pos_encoding: sinusoidal
experiment_name: ${experiment.name}
seed: 7
runtime:
  device: cuda
paths:
  data_dir: ${hydra:runtime.cwd}/research/data
  output_dir: ${hydra:runtime.cwd}/research/results/${experiment_name}/L${dataset.seq_length}/${now:%Y-%m-%d_%H-%M-%S}_seed${seed}
