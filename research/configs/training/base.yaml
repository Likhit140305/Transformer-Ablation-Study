# =============================================================================
# Training configuration shared by every condition (equal compute budget).
# =============================================================================

# @package training
max_epochs: 20          # Baseline validation PPL plateaus by ~epoch 20 (legacy 30-epoch pilot)
max_steps: null         # If set, overrides max_epochs

learning_rate: 3.0e-4
weight_decay: 0.1
gradient_clip_val: 1.0
warmup_steps: 200       # Linear warmup, then per-step decay
scheduler: cosine       # cosine | linear | constant
eta_min_ratio: 0.1      # Final LR = learning_rate * eta_min_ratio
accumulate_grad_batches: 1

precision: bf16         # bf16 | fp32 (autocast dtype for forward passes)
save_best_model: true   # Best-validation checkpoint, also used for the test evaluation

deterministic: false    # Fused SDPA kernels have no deterministic backward; seed variance dominates
benchmark: false
