# =============================================================================
# Base Training Configuration
# All training hyperparameters. Zero hardcoding in Python.
# =============================================================================

# @package training

# ── Training Duration ─────────────────────────────────────────────────────────
max_epochs: 30
max_steps: null         # If set, overrides max_epochs

# ── Optimization ──────────────────────────────────────────────────────────────
learning_rate: 3.0e-4
weight_decay: 0.1
gradient_clip_val: 1.0
warmup_steps: 200       # Linear warmup then cosine decay

# ── Scheduler ────────────────────────────────────────────────────────────────
scheduler: cosine       # Options: cosine, linear, constant
eta_min_ratio: 0.1      # Minimum LR = learning_rate * eta_min_ratio

# ── Batch Configuration ───────────────────────────────────────────────────────
accumulate_grad_batches: 1

# ── Evaluation ───────────────────────────────────────────────────────────────
eval_every_n_epochs: 1
eval_batches: null      # null = use full validation set

# ── Checkpointing ────────────────────────────────────────────────────────────
save_best_model: true
save_final_model: true
checkpoint_metric: val_perplexity
checkpoint_mode: min    # lower is better for perplexity

# ── Logging ───────────────────────────────────────────────────────────────────
log_every_n_steps: 50

# ── Early Stopping ────────────────────────────────────────────────────────────
early_stopping: false
early_stopping_patience: 5
early_stopping_min_delta: 0.1

# ── Mixed Precision ───────────────────────────────────────────────────────────
# Use bf16 on Ampere+ GPUs, fp16 otherwise. Set to null to disable.
precision: null         # Options: null, "fp16", "bf16"

# ── Determinism ───────────────────────────────────────────────────────────────
deterministic: true
benchmark: false        # torch.backends.cudnn.benchmark
